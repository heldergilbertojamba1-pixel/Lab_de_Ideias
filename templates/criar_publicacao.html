{% extends "base.html" %}{% block title %}Criar publicação{% endblock %}{% block content %}<section class="head"><small class="gold">NOVA PUBLICAÇÃO</small><h1>O que queres partilhar?</h1><p>Publica algo útil, interessante ou importante para a tua comunidade.</p></section><div class="formwrap"><form class="form wide" method="post" enctype="multipart/form-data"><label>Tipo de publicação<select name="post_type"><option>Atualização</option><option>Projeto</option><option>Produto</option><option>Serviço</option><option>Oportunidade</option><option>Conquista</option><option>Ideia</option><option>Notícia</option></select></label><label>Texto da publicação<textarea name="content" rows="7" maxlength="2000" required placeholder="Escreve aqui a tua publicação..."></textarea></label><label>Imagem (opcional)<input type="file" name="image" accept="image/png,image/jpeg,image/webp"><small class="hint">PNG, JPG ou WEBP.</small></label><button class="btn goldbg">Publicar agora</button><a class="btn" href="{{url_for('publicacoes')}}">Cancelar</a></form></div>{% endblock %}
