{% extends "base.html" %}{% block title %}Criar conta • Lab de Ideias{% endblock %}{% block content %}<div class="formwrap"><form class="form wide" method="post"><small class="gold">COMEÇA AQUI</small><h1>Cria a tua conta.</h1><p class="muted">Toda conta começa com <b>15 dias grátis</b>.</p><label>Nome<input name="name" required></label><label>Email<input type="email" name="email" required></label><label>Senha<input type="password" name="password" minlength="6" required></label><label>Tipo de conta<select name="user_type" id="user_type"><option value="person">Pessoa</option><option value="company">Empresa</option></select></label><div id="company-size"><label>Dimensão da empresa<select name="business_size"><option value="micro">Microempresa</option><option value="small">Pequena empresa</option><option value="medium">Média empresa</option><option value="large">Grande empresa</option></select></label></div><label>Localização<input name="location" placeholder="Ex.: Moçâmedes, Namibe"></label><button class="btn goldbg">Começar 15 dias grátis</button></form></div>{% endblock %}
