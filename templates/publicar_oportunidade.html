{% extends "base.html" %}{% block title %}Publicar oportunidade{% endblock %}
{% block content %}<div class="formwrap"><form class="form wide" method="post"><small class="gold">OPORTUNIDADE</small><h1>Publicar uma oportunidade</h1><p>Apresenta claramente o que procuras e facilita o contacto com candidatos.</p><div class="form-grid"><label>Título<input name="title" maxlength="120" required placeholder="Ex.: Designer gráfico freelancer"></label><label>Tipo<select name="type"><option>Emprego</option><option>Freelance</option><option>Estágio</option><option>Parceria</option><option>Projeto</option><option>Outro</option></select></label><label>Localização<input name="location" placeholder="Ex.: Moçâmedes ou Online"></label><label>Prazo de candidatura<input type="date" name="deadline"></label></div><label>Descrição<textarea name="description" rows="7" maxlength="2000" required placeholder="Explica a oportunidade, função, projeto ou parceria."></textarea></label><label>Requisitos<textarea name="requirements" rows="5" maxlength="1500" placeholder="Experiência, competências, formação, disponibilidade..." ></textarea></label><label>Contacto da empresa<input name="contact" placeholder="WhatsApp, telefone ou email"></label><button class="btn goldbg">Publicar oportunidade</button></form></div>{% endblock %}
